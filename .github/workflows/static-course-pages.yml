name: Deploy static course

on:
  push:
    branches: [codex/static-course-demo]

concurrency:
  group: static-course-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run course:build
      - name: Attach demo domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/lingxiloop-course-demo/domains`;
          const headers = { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`, 'Content-Type': 'application/json' };
          const request = async (url, options = {}) => {
            const response = await fetch(url, { ...options, headers });
            const body = await response.json();
            if (!response.ok || !body.success) throw new Error(`Cloudflare request failed (${response.status})`);
            return body.result;
          };
          const hostname = 'demo.way2api.fun';
          const domains = await request(base);
          if (!domains.some(({ name }) => name === hostname)) await request(base, { method: 'POST', body: JSON.stringify({ name: hostname }) });
          const [zone] = await request('https://api.cloudflare.com/client/v4/zones?name=way2api.fun');
          if (!zone) throw new Error('Cloudflare zone was not found');
          const records = await request(`https://api.cloudflare.com/client/v4/zones/${zone.id}/dns_records?name=${hostname}`);
          const desired = { type: 'CNAME', name: hostname, content: 'lingxiloop-course-demo.pages.dev', proxied: true, ttl: 1 };
          if (records.length === 0) {
            await request(`https://api.cloudflare.com/client/v4/zones/${zone.id}/dns_records`, { method: 'POST', body: JSON.stringify(desired) });
          } else if (records.length !== 1 || records[0].type !== 'CNAME') {
            throw new Error('A conflicting DNS record already exists');
          } else if (records[0].content !== desired.content || !records[0].proxied) {
            await request(`https://api.cloudflare.com/client/v4/zones/${zone.id}/dns_records/${records[0].id}`, { method: 'PUT', body: JSON.stringify(desired) });
          }
          NODE
      - name: Publish branch build
        run: npx wrangler pages deploy static-course/dist --project-name lingxiloop-course-demo --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" --commit-message "$GITHUB_SHA" --commit-dirty false
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
