name: Live Agent Eval

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      profile:
        description: Eval profile
        type: choice
        options: [core, full]
        default: core
      job_id:
        description: Existing eval job id from Control Plane
        type: string
        required: false
      commit_sha:
        description: Candidate commit created by Control Plane
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: live-eval-${{ github.ref }}-${{ inputs.profile || 'core' }}
  cancel-in-progress: false

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      EVAL_PROFILE: ${{ inputs.profile || 'core' }}
      EVAL_JOB_ID: ${{ inputs.job_id }}
      EVAL_COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
      EVAL_CALLBACK_URL: ${{ vars.EVAL_CALLBACK_URL }}
      EVAL_CI_HMAC_SECRET: ${{ secrets.EVAL_CI_HMAC_SECRET }}
      EVAL_CANDIDATE_API_KEY: ${{ secrets.EVAL_CANDIDATE_API_KEY || secrets.OPENAI_API_KEY }}
      EVAL_CANDIDATE_BASE_URL: ${{ vars.EVAL_CANDIDATE_BASE_URL || vars.OPENAI_BASE_URL }}
      EVAL_CANDIDATE_MODEL: ${{ vars.EVAL_CANDIDATE_MODEL || vars.OPENAI_MODEL }}
      EVAL_JUDGE_API_KEY: ${{ secrets.EVAL_JUDGE_API_KEY }}
      EVAL_JUDGE_BASE_URL: ${{ vars.EVAL_JUDGE_BASE_URL }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_SERVICE_NAME: lingxiloop-live-eval
      OTEL_DEPLOYMENT_ENVIRONMENT: ci
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.commit_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Run real Agent OS Eval
        run: npm run eval:live -- --profile "$EVAL_PROFILE"
      - if: always() && hashFiles('artifacts/eval-live-report.json') != ''
        uses: actions/upload-artifact@v4
        with: { name: "live-agent-eval-${{ github.sha }}", path: artifacts/eval-live-report.json, if-no-files-found: error }
