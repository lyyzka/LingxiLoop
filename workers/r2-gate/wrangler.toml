# Public avatar delivery only. Private object reads go through /api/files,
# where the application checks the current company and course authorization.
# Replace the example account, bucket, and route with the owned deployment values.

name = "lingxiloop-r2-gate"
main = "src/index.ts"
compatibility_date = "2024-09-01"
account_id = "00000000000000000000000000000000"

# Bind the bucket directly — reads use the Workers Runtime API
# (`env.BUCKET.get(key)`), no S3 hop.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "lingxiloop-attachments-example"

# Take over the cdn.example.com hostname. The bucket's "Custom Domain"
# setup created the DNS + TLS; this route layers our auth logic on top
# of it.
[[routes]]
pattern = "cdn.example.com/*"
zone_name = "example.com"
