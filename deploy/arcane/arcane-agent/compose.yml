name: arcane-agent

services:
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    container_name: arcane-agent-docker-proxy
    user: "0:0"
    command:
      - -listenip=0.0.0.0
      - -allowfrom=arcane-edge-agent
      - -allowhealthcheck
      - -allowGET=(/v[d.]+)?/(_ping|events|version|info|containers|exec|images|networks|volumes|distribution|swarm|nodes|services|tasks|secrets|configs)(/.*)?
      - -allowHEAD=(/v[d.]+)?/(_ping|version)(/.*)?
      - -allowPOST=(/v[d.]+)?/(containers|exec|images|networks|volumes|commit|build|session|grpc|auth|swarm|nodes|services|secrets|configs)(/.*)?
      - -allowPUT=(/v[d.]+)?/containers(/.*)?
      - -allowDELETE=(/v[d.]+)?/(containers|images|networks|volumes|nodes|services|secrets|configs)(/.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ./healthcheck]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  arcane-edge-agent:
    image: ghcr.io/getarcaneapp/agent:v2.10.2
    container_name: arcane-edge-agent
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    environment:
      EDGE_AGENT: "true"
      EDGE_TRANSPORT: poll
      AGENT_TOKEN: ${ARCANE_AGENT_TOKEN:?ARCANE_AGENT_TOKEN is required}
      MANAGER_API_URL: https://ops.christmas1314.xyz
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      PROJECTS_DIRECTORY: /app/data/projects
      TZ: Asia/Shanghai
    volumes:
      - arcane-agent-data:/app/data
      - /opt/arcane/projects:/app/data/projects
    restart: unless-stopped

volumes:
  arcane-agent-data: {}
