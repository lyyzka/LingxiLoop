name: arcane-manager

services:
  docker-socket-proxy:
    image: accel.way2api.fun/docker.io/wollomatic/socket-proxy:1.13.1
    container_name: arcane-docker-proxy
    user: "0:0"
    command:
      - -listenip=0.0.0.0
      - -allowfrom=arcane
      - -allowhealthcheck
      - -allowGET=(/v[d.]+)?/(_ping|events|version|info|containers|exec|images|networks|volumes|distribution|swarm|nodes|services|tasks|secrets|configs)(/.*)?
      - -allowHEAD=(/v[d.]+)?/(_ping|version)(/.*)?
      - -allowPOST=(/v[d.]+)?/(containers|exec|images|networks|volumes|commit|build|session|grpc|auth|swarm|nodes|services|secrets|configs)(/.*)?
      - -allowPUT=(/v[d.]+)?/containers(/.*)?
      - -allowDELETE=(/v[d.]+)?/(containers|images|networks|volumes|nodes|services|secrets|configs)(/.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ./healthcheck]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  arcane:
    image: accel.way2api.fun/ghcr.io/getarcaneapp/manager:v2.10.2
    container_name: arcane
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    ports:
      - 127.0.0.1:3552:3552
    environment:
      APP_URL: https://ops.christmas1314.xyz
      TRUSTED_PROXIES: 172.16.0.0/12
      ENCRYPTION_KEY: ${ARCANE_ENCRYPTION_KEY:?ARCANE_ENCRYPTION_KEY is required}
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      PROJECTS_DIRECTORY: /app/data/projects
      FOLLOW_PROJECT_SYMLINKS: "true"
      TZ: Asia/Shanghai
    volumes:
      - arcane-data:/app/data
      - /opt/arcane/projects:/app/data/projects
      - /opt/apps/wegolibrary:/opt/apps/wegolibrary
    healthcheck:
      test: [CMD, ./arcane, health]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  arcane-data: {}
